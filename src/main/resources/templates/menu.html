<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAÍCES - Portal Bio-Nutricional</title>

    <link rel="manifest" href="manifest_menu.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#01120a">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bio-oro: #ffd700;
            --bio-aqua: #00f0ff;
            --borde-madera: #2d180b;
            --v-profundo: #01120a;
            --resplandor-divino: 0 0 35px rgba(255, 215, 0, 0.6);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--v-profundo);
            background-image:
                linear-gradient(rgba(1, 10, 5, 0.2), rgba(1, 10, 5, 0.5)),
                url('https://res.cloudinary.com/doi0o3hlr/image/upload/q_auto,f_auto,w_1000/v1774759858/Gemini_Generated_Image_2ocvdw2ocvdw2ocv_ixqdsz.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; min-height: 100vh; margin: 0; overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            overflow: hidden;
        }

        .fondo-puerta-viva {
            position: absolute; top: -5%; left: -5%; width: 110%; height: 110%;
            background-color: #050505;
            background-image: linear-gradient(rgba(1, 18, 10, 0.2), rgba(1, 18, 10, 0.6)), url('puerta-magica.jpg');
            background-size: cover; background-position: center;
            z-index: 1;
            animation: respiracionMagica 6s infinite alternate ease-in-out;
            transition: transform 1.5s cubic-bezier(0.5, 0, 0.2, 1), filter 1.5s ease-in;
        }

        @keyframes respiracionMagica {
            0% { transform: scale(1); filter: brightness(0.95) contrast(1.05) hue-rotate(0deg); }
            100% { transform: scale(1.04); filter: brightness(1.2) contrast(1.15) hue-rotate(8deg); }
        }

        .contenido-inicio {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            width: 100%;
        }

        /* NUEVOS BOTONES DE NODO (PAÍSES) */
        .btn-nodo {
            background: radial-gradient(circle, rgba(10, 20, 15, 0.8) 0%, rgba(0, 0, 0, 0.9) 100%);
            backdrop-filter: blur(10px); color: var(--bio-oro); border: 2px solid var(--bio-oro);
            padding: 15px 20px; font-family: 'Orbitron'; font-size: 1.1rem; font-weight: 900;
            letter-spacing: 2px; cursor: pointer; border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2), inset 0 0 10px rgba(255, 215, 0, 0.1);
            transition: all 0.3s ease; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-nodo:hover, .btn-nodo:active {
            color: #fff; border-color: var(--bio-aqua); background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 30px var(--bio-aqua), inset 0 0 15px var(--bio-aqua);
            text-shadow: 0 0 8px #fff, 0 0 15px var(--bio-aqua); transform: scale(1.03);
        }

        .efecto-wow-puerta {
            transform: scale(5) translateZ(0) !important; filter: brightness(3) contrast(1.5) blur(3px) !important;
        }

        #destello-luz {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #ffffff 10%, #ccffff 90%);
            z-index: 99999; opacity: 0; pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1); mix-blend-mode: screen;
        }

        /* ========================================================= */

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,255,136,0.03) 50%, rgba(0,255,136,0.03));
            background-size: 100% 8px; z-index: 9998; pointer-events: none;
            opacity: 1; animation: scrollScanlines 10s linear infinite;
        }
        @keyframes scrollScanlines { from { background-position: 0 0; } to { background-position: 0 100vh; } }

        .video-fondo-catalogo {
            position: fixed; top: 50%; left: 50%;
            min-width: 100vw; min-height: 100vh;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0; pointer-events: none;
        }

        .video-fondo-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(rgba(1, 15, 8, 0.4), rgba(1, 15, 8, 0.72));
            z-index: 1; pointer-events: none;
        }

        .fireflies { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .firefly { position: absolute; border-radius: 50%; opacity: 0; animation: float-up linear infinite, parpadeo ease-in-out infinite alternate; }
        @keyframes float-up { 0% { transform: translateY(105vh) translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-15vh) translateX(50px); opacity: 0; } }
        @keyframes parpadeo { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        .header-raices { position: relative; z-index: 10; padding: 40px 15px 20px; text-align: center; }

        /* BOTÓN DE AUDIO */
        .btn-audio-toggle {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 240, 255, 0.1); color: var(--bio-aqua); border: 1px solid var(--bio-aqua);
            width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem;
            cursor: pointer; z-index: 100; box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); backdrop-filter: blur(5px);
            transition: 0.3s; display: flex; justify-content: center; align-items: center;
        }
        .btn-audio-toggle:hover { background: var(--bio-aqua); color: #000; box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); }

        /* BOTÓN DE INSTALAR APP */
        .btn-instalar-app {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0, 240, 255, 0.1); color: var(--bio-aqua); border: 1px solid var(--bio-aqua);
            padding: 8px 15px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700;
            cursor: pointer; z-index: 100; box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .btn-instalar-app:hover { background: var(--bio-aqua); color: #000; box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); }

        .titulo-raices {
            font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900;
            color: transparent; -webkit-text-stroke: 1.5px #b38600;
            background: linear-gradient(180deg, #fff 30%, var(--bio-oro));
            background-clip: text; -webkit-background-clip: text;
            text-shadow: 0 5px 25px rgba(0, 0, 0, 0.9); letter-spacing: 8px; margin-bottom: 5px;
        }

        /* BADGE INDICADOR DE SUCURSAL */
        .badge-nodo-actual {
            background: rgba(1, 10, 5, 0.85); border: 1px solid rgba(255, 215, 0, 0.5);
            color: var(--bio-oro); font-family: 'Orbitron', sans-serif; padding: 6px 15px;
            border-radius: 20px; display: inline-block; font-size: 0.85rem; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), 0 0 10px rgba(255, 215, 0, 0.2); backdrop-filter: blur(5px);
            margin-top: 5px; margin-bottom: 15px; text-transform: uppercase;
        }

        .contenedor-categorias { display: flex; flex-wrap: wrap; gap: 20px 14px; justify-content: center; margin: 34px 0 30px; z-index: 10; position: relative; }
        .categoria-badge { 
            position: relative; 
            background: rgba(10, 5, 2, 0.88); 
            color: rgba(255,255,255,0.9); 
            padding: 12px 22px; 
            border-radius: 10px; 
            border: 2px solid rgba(255,215,0,0.4); 
            font-weight: 700; 
            letter-spacing: 2px; 
            font-family: 'Orbitron', sans-serif; 
            font-size: 0.82rem; 
            text-transform: uppercase; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.8); 
            backdrop-filter: blur(5px); 
            transition: all 0.25s ease;
        }
        .categoria-badge:hover {
            border-color: var(--bio-oro);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.9), 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* ========================================================= */
        /* CINTA / LISTÓN NEÓN REAL SOBRE CATEGORÍAS (ALTO IMPACTO) */
        /* ========================================================= */
        .liston-categoria-neon {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 3px 18px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif !important;
            font-size: 0.70rem !important;
            font-weight: 900 !important;
            letter-spacing: 2px !important;
            text-transform: uppercase !important;
            white-space: nowrap !important;
            z-index: 100 !important;
            pointer-events: none !important;
            line-height: 1.2 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.9) !important;
        }

        /* Puntas de cinta / listón estilo banderín diamantado */
        .liston-categoria-neon::before,
        .liston-categoria-neon::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 7px;
            height: 7px;
            transform: translateY(-50%) rotate(45deg);
            z-index: 1;
        }
        .liston-categoria-neon::before { left: -4px; }
        .liston-categoria-neon::after { right: -4px; }

        /* MAGENTA (FUCSIA ELÉCTRICO NEÓN) */
        .liston-neon-magenta,
        .neon-magenta {
            background: #0d0111 !important;
            border: 2px solid #ff00ea !important;
            box-shadow: 
                0 0 10px #ff00ea, 
                0 0 25px rgba(255, 0, 234, 0.7), 
                inset 0 0 8px rgba(255, 0, 234, 0.4),
                0 4px 12px rgba(0,0,0,0.95) !important;
            animation: pulsoNeonMagenta 1.8s infinite alternate !important;
        }
        .liston-neon-magenta,
        .neon-magenta,
        .liston-neon-magenta *,
        .neon-magenta * {
            color: #ff33db !important;
            text-shadow: 
                0 0 2px #ffffff, 
                0 0 8px #ff00ea, 
                0 0 18px #ff00ea, 
                0 0 32px #d000ff !important;
        }
        .liston-neon-magenta::before,
        .liston-neon-magenta::after,
        .neon-magenta::before,
        .neon-magenta::after {
            background: #ff00ea !important;
            box-shadow: 0 0 8px #ff00ea !important;
        }
        @keyframes pulsoNeonMagenta {
            0% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 8px #ff00ea, 0 0 18px rgba(255, 0, 234, 0.6), inset 0 0 6px rgba(255, 0, 234, 0.3), 0 4px 10px rgba(0,0,0,0.95);
                text-shadow: 0 0 2px #fff, 0 0 6px #ff00ea, 0 0 14px #ff00ea;
            }
            100% {
                transform: translateX(-50%) scale(1.06);
                box-shadow: 0 0 16px #ff00ea, 0 0 35px rgba(255, 0, 234, 0.95), inset 0 0 12px rgba(255, 0, 234, 0.5), 0 4px 12px rgba(0,0,0,0.95);
                text-shadow: 0 0 3px #fff, 0 0 10px #ff00ea, 0 0 24px #ff00ea, 0 0 40px #d000ff;
            }
        }

        /* ORO (DORADO / FUEGO OFERTAS) */
        .liston-neon-oro,
        .neon-oro {
            background: #140d00 !important;
            border: 2px solid #ffd700 !important;
            box-shadow: 
                0 0 10px #ffd700, 
                0 0 25px rgba(255, 215, 0, 0.7), 
                inset 0 0 8px rgba(255, 215, 0, 0.4),
                0 4px 12px rgba(0,0,0,0.95) !important;
            animation: pulsoNeonOro 1.8s infinite alternate !important;
        }
        .liston-neon-oro,
        .neon-oro,
        .liston-neon-oro *,
        .neon-oro * {
            color: #ffe600 !important;
            text-shadow: 
                0 0 2px #ffffff, 
                0 0 8px #ffd700, 
                0 0 18px #ff9900, 
                0 0 32px #ff5500 !important;
        }
        .liston-neon-oro::before,
        .liston-neon-oro::after,
        .neon-oro::before,
        .neon-oro::after {
            background: #ffd700 !important;
            box-shadow: 0 0 8px #ffd700 !important;
        }
        @keyframes pulsoNeonOro {
            0% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 8px #ffd700, 0 0 18px rgba(255, 215, 0, 0.6), inset 0 0 6px rgba(255, 215, 0, 0.3), 0 4px 10px rgba(0,0,0,0.95);
                text-shadow: 0 0 2px #fff, 0 0 6px #ffd700, 0 0 14px #ff9900;
            }
            100% {
                transform: translateX(-50%) scale(1.06);
                box-shadow: 0 0 16px #ffd700, 0 0 35px rgba(255, 215, 0, 0.95), inset 0 0 12px rgba(255, 215, 0, 0.5), 0 4px 12px rgba(0,0,0,0.95);
                text-shadow: 0 0 3px #fff, 0 0 10px #ffd700, 0 0 24px #ff9900, 0 0 40px #ff3300;
            }
        }

        /* CYAN (AQUA ELÉCTRICO) */
        .liston-neon-cyan,
        .neon-cyan {
            background: #001018 !important;
            border: 2px solid #00f0ff !important;
            box-shadow: 
                0 0 10px #00f0ff, 
                0 0 25px rgba(0, 240, 255, 0.7), 
                inset 0 0 8px rgba(0, 240, 255, 0.4),
                0 4px 12px rgba(0,0,0,0.95) !important;
            animation: pulsoNeonCyan 1.8s infinite alternate !important;
        }
        .liston-neon-cyan,
        .neon-cyan,
        .liston-neon-cyan *,
        .neon-cyan * {
            color: #00f0ff !important;
            text-shadow: 
                0 0 2px #ffffff, 
                0 0 8px #00f0ff, 
                0 0 18px #00aaff, 
                0 0 32px #0066ff !important;
        }
        .liston-neon-cyan::before,
        .liston-neon-cyan::after,
        .neon-cyan::before,
        .neon-cyan::after {
            background: #00f0ff !important;
            box-shadow: 0 0 8px #00f0ff !important;
        }
        @keyframes pulsoNeonCyan {
            0% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 8px #00f0ff, 0 0 18px rgba(0, 240, 255, 0.6), inset 0 0 6px rgba(0, 240, 255, 0.3), 0 4px 10px rgba(0,0,0,0.95);
            }
            100% {
                transform: translateX(-50%) scale(1.06);
                box-shadow: 0 0 16px #00f0ff, 0 0 35px rgba(0, 240, 255, 0.95), inset 0 0 12px rgba(0, 240, 255, 0.5), 0 4px 12px rgba(0,0,0,0.95);
            }
        }

        /* VERDE (BIO NEÓN) */
        .liston-neon-verde,
        .neon-verde {
            background: #001509 !important;
            border: 2px solid #00ff88 !important;
            box-shadow: 
                0 0 10px #00ff88, 
                0 0 25px rgba(0, 255, 136, 0.7), 
                inset 0 0 8px rgba(0, 255, 136, 0.4),
                0 4px 12px rgba(0,0,0,0.95) !important;
            animation: pulsoNeonVerde 1.8s infinite alternate !important;
        }
        .liston-neon-verde,
        .neon-verde,
        .liston-neon-verde *,
        .neon-verde * {
            color: #00ff88 !important;
            text-shadow: 
                0 0 2px #ffffff, 
                0 0 8px #00ff88, 
                0 0 18px #00cc66, 
                0 0 32px #008833 !important;
        }
        .liston-neon-verde::before,
        .liston-neon-verde::after,
        .neon-verde::before,
        .neon-verde::after {
            background: #00ff88 !important;
            box-shadow: 0 0 8px #00ff88 !important;
        }
        @keyframes pulsoNeonVerde {
            0% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 8px #00ff88, 0 0 18px rgba(0, 255, 136, 0.6);
            }
            100% {
                transform: translateX(-50%) scale(1.06);
                box-shadow: 0 0 16px #00ff88, 0 0 35px rgba(0, 255, 136, 0.95);
            }
        }

        /* ROJO (ALERTA / FLASH) */
        .liston-neon-rojo,
        .neon-rojo {
            background: #180005 !important;
            border: 2px solid #ff1744 !important;
            box-shadow: 
                0 0 10px #ff1744, 
                0 0 25px rgba(255, 23, 68, 0.7), 
                inset 0 0 8px rgba(255, 23, 68, 0.4),
                0 4px 12px rgba(0,0,0,0.95) !important;
            animation: pulsoNeonRojo 1.8s infinite alternate !important;
        }
        .liston-neon-rojo,
        .neon-rojo,
        .liston-neon-rojo *,
        .neon-rojo * {
            color: #ff3355 !important;
            text-shadow: 
                0 0 2px #ffffff, 
                0 0 8px #ff1744, 
                0 0 18px #ff0033, 
                0 0 32px #990000 !important;
        }
        .liston-neon-rojo::before,
        .liston-neon-rojo::after,
        .neon-rojo::before,
        .neon-rojo::after {
            background: #ff1744 !important;
            box-shadow: 0 0 8px #ff1744 !important;
        }
        @keyframes pulsoNeonRojo {
            0% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 8px #ff1744, 0 0 18px rgba(255, 23, 68, 0.6);
            }
            100% {
                transform: translateX(-50%) scale(1.06);
                box-shadow: 0 0 16px #ff1744, 0 0 35px rgba(255, 23, 68, 0.95);
            }
        }

        .categoria-badge.active { background: rgba(255, 215, 0, 0.2); color: var(--bio-oro); border-color: var(--bio-oro); box-shadow: var(--resplandor-divino); }

        .item-tarjeta { position: relative; z-index: 1; transition: z-index 0.2s; }
        .item-tarjeta:hover { z-index: 100; }

        .card-escena { perspective: 1000px; width: 100%; height: 400px; position: relative; margin-bottom: 20px; }
        .card-flipper { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-escena.flipped .card-flipper { transform: rotateY(180deg); }

        .card-front, .card-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; border: 6px solid #3e2312; border-bottom-color: #1a0f07; border-right-color: #1a0f07; border-top-color: #5a361d; border-left-color: #5a361d; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.95), inset 0 0 30px rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .card-front { background: linear-gradient(rgba(20, 10, 2, 0.7), rgba(20, 10, 2, 0.9)), #180b06; padding: 20px 15px; justify-content: space-between; }
        .card-back { background: #0a0502; transform: rotateY(180deg); padding: 30px 20px; border-color: var(--bio-oro); }

        .enredadera-magica { position: absolute; top: -12px; left: -12px; right: -12px; bottom: -12px; background-image: url('lianas-limpias.png'); background-size: 100% 100%; background-position: center; background-repeat: no-repeat; pointer-events: none; z-index: 15; }
        .card-escena.flipped .enredadera-magica { opacity: 0; transition: opacity 0.3s; }

        .img-zona { height: 180px; display: flex; justify-content: center; align-items: center; position: relative; z-index: 10; }
        .img-batido { width: 80%; height: 80%; object-fit: contain; z-index: 2; filter: drop-shadow(0 15px 25px rgba(0,0,0,1)); animation: flotar 4s infinite alternate ease-in-out; }
        @keyframes flotar { from { transform: translateY(5px); } to { transform: translateY(-5px); } }

        .nombre-prod { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; color: #fff; text-transform: uppercase; margin-bottom: 2px; text-shadow: 0 3px 8px #000, 0 0 15px rgba(0,0,0,0.9); text-align: center; position: relative; z-index: 25; }
        .info-prod-box { position: relative; z-index: 25; text-align: center; width: 100%; }
        .precio-container { position: relative; z-index: 25; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .precio-prod { font-family: 'Orbitron', sans-serif; color: var(--bio-oro); font-weight: 900; font-size: 1.4rem; text-shadow: 0 3px 8px #000, 0 0 15px rgba(0,0,0,0.9); text-align: center; position: relative; z-index: 25; line-height: 1.1; }

        .btn-info-flip { position: absolute; top: 10px; right: 10px; background: rgba(5, 2, 0, 0.85); color: var(--bio-oro); border: 1px solid var(--bio-oro); width: auto; padding: 6px 14px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; z-index: 30; box-shadow: 0 5px 10px rgba(0,0,0,0.8); backdrop-filter: blur(5px); cursor: pointer; transition: 0.3s; }
        .btn-info-flip:hover { background: var(--bio-oro); color: #000; }

        .badge-descuento {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            z-index: 30;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: pulse-dto 2s infinite alternate;
        }
        @keyframes pulse-dto {

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ==========================================
    // LÓGICA DE INSTALACIÓN PWA (APP CELULAR)
    // ==========================================
    let eventoInstalacion;
    const btnInstalar = document.getElementById('btnInstalarApp');

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('PWA Lista');
            }).catch(err => console.log('Error PWA', err));
        });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        eventoInstalacion = e;
        if (btnInstalar) btnInstalar.style.display = 'block';
    });

    if (btnInstalar) {
        btnInstalar.addEventListener('click', async () => {
            if (eventoInstalacion) {
                eventoInstalacion.prompt();
                const resultado = await eventoInstalacion.userChoice;
                if (resultado.outcome === 'accepted') {
                    console.log('El usuario instaló la App RAÍCES');
                }
                eventoInstalacion = null;
                btnInstalar.style.display = 'none';
            }
        });
    }

    // ==========================================
    // ANIMACIÓN INICIAL, SELECCIÓN DE NODO Y AUDIO
    // ==========================================
    let mainAudio = document.getElementById('mainAudio');
    let cashSound = document.getElementById('sfxCash');

    function toggleAudio() {
        const icono = document.getElementById('icono-audio');
        if (mainAudio.paused) {
            mainAudio.play();
            icono.className = 'bi bi-volume-up-fill';
        } else {
            mainAudio.pause();
            icono.className = 'bi bi-volume-mute-fill';
        }
    }

    function iniciarExperiencia(paisSeleccionado = 'Antofagasta') {
        // Guardar selección
        document.getElementById('sucursal-activa').value = 'Antofagasta';
        document.getElementById('display-nodo-actual').innerText = '🇨🇱 NODO ANTOFAGASTA';

        // Efectos visuales
        const puerta = document.getElementById('fondo-puerta');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const textosInicio = document.getElementById('contenido-textos-inicio');
        const destello = document.getElementById('destello-luz');
        const btnMic = document.getElementById('btn-mic-cliente');
        const btnAudio = document.getElementById('btn-audio-toggle');

        textosInicio.style.transform = 'scale(0.8)';
        textosInicio.style.opacity = '0';

        puerta.classList.add('efecto-wow-puerta');

        const vidFondo = document.getElementById('video-fondo-catalogo');
        if (vidFondo && vidFondo.paused) {
            vidFondo.play().catch(e => console.warn("Video background play:", e));
        }

        mainAudio.play().catch(e => {
            console.error("Música bloquedada", e);
            document.getElementById('icono-audio').className = 'bi bi-volume-mute-fill';
        });

        setTimeout(() => { destello.style.opacity = '1'; }, 600);

        setTimeout(() => {
            pantallaInicio.style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            btnAudio.style.display = 'flex';
            if('webkitSpeechRecognition' in window) { btnMic.style.display = 'flex'; }
            cargarMenu();
        }, 1200);

        setTimeout(() => {
            destello.style.transition = 'opacity 1.5s ease-out';
            destello.style.opacity = '0';
        }, 1500);
    }

    function playCashSound() { cashSound.currentTime = 0; cashSound.play().catch(e => console.error(e)); }

    const containerL = document.getElementById('firefly-container');
    const colores = ['#ffd700', '#00ff88', '#00e5ff'];
    const esCelular = window.innerWidth <= 768;
    const cantidadLuciernagas = esCelular ? 12 : 40; // Magia ligera en celular, intensa en PC

    for(let i=0; i<cantidadLuciernagas; i++) {
        let f = document.createElement('div'); f.className = 'firefly';
        let size = Math.random() * 4 + 2;
        f.style.width = size + 'px'; f.style.height = size + 'px';
        f.style.background = colores[Math.floor(Math.random() * colores.length)];
        
        if (!esCelular) {
            // Sombra súper pesada solo para computadores grandes
            f.style.boxShadow = `0 0 ${size*3}px ${size}px ${f.style.background}`;
        } else {
            // Brillo sencillo en celular para proteger el procesador
            f.style.boxShadow = `0 0 5px ${f.style.background}`;
        }
        
        f.style.left = Math.random() * 100 + 'vw';
        f.style.animationDuration = (Math.random() * 8 + 8) + 's, ' + (Math.random() * 2 + 1) + 's';
        f.style.animationDelay = (Math.random() * 5) + 's, 0s';
        containerL.appendChild(f);
    }

    // ==========================================
    // LÓGICA DE MENÚ Y CARRITO
    // ==========================================
    let productosRaw = []; let carrito = []; let filtroActual = '500 mls'; let simboloActual = '$'; let modalCarritoCliente;

    window.addEventListener('DOMContentLoaded', () => { modalCarritoCliente = new bootstrap.Modal(document.getElementById('modalCarritoCliente')); });

    // Resetea el estado del asistente de voz del modal cuando lo cierran
    document.getElementById('modalCarritoCliente').addEventListener('hidden.bs.modal', function () {
        estadoModalVoz = 'LIBRE';
        window.speechSynthesis.cancel();
        if(recVozModal) recVozModal.stop();
    });

    async function cargarMenu() {
        const grid = document.getElementById('grid-menu'); const nodo = document.getElementById('sucursal-activa').value;
        grid.innerHTML = '<div class="col-12 text-center text-white py-5">Sincronizando con el Núcleo...</div>';
        try {
            let res = await fetch('/api/productos/sucursal/' + nodo + '?_t=' + Date.now(), { cache: 'no-store' });
            if(res.ok) { productosRaw = await res.json(); } else { productosRaw = []; }
            if(!productosRaw || productosRaw.length === 0) {
                res = await fetch('/api/productos?_t=' + Date.now(), { cache: 'no-store' });
                if(res.ok) { productosRaw = await res.json(); }
            }
            if(Array.isArray(productosRaw)) {
                productosRaw = productosRaw.filter(p => {
                    const cat = (p.categoria || '').toLowerCase();
                    const nom = (p.nombre || '').toLowerCase();
                    return !cat.includes('personalizado') && !cat.includes('custom') && !nom.startsWith('batido armado') && !nom.startsWith('batido personalizado');
                });
                productosRaw.forEach(p => {
                    let num = Number(p.precio) || 0;
                    if (num > 0 && num <= 100) num = num * 1000;
                    p.precio = Math.round(num);
                    p.descuento = Number(p.descuento) || 0;
                });
            }
            renderizar();
            aplicarBadgesCategorias();
        } catch (e) { productosRaw = []; renderizar(); aplicarBadgesCategorias(); }
    }

    let categoriaBadgesConfig = [];

    async function cargarBadgesCategorias() {
        try {
            const res = await fetch('/api/categorias/badges?_t=' + Date.now(), { cache: 'no-store' });
            if (res.ok) {
                categoriaBadgesConfig = await res.json();
            }
        } catch(e) {
            console.warn("No se pudieron cargar badges de categorías desde API:", e);
        }
        aplicarBadgesCategorias();
    }

    function aplicarBadgesCategorias() {
        const catMap = {
            '500 mls': document.getElementById('badge-cat-500-mls'),
            'Packs': document.getElementById('badge-cat-Packs'),
            'Arma tu Batido': document.getElementById('badge-cat-Arma-tu-Batido'),
            'Shots': document.getElementById('badge-cat-Shots')
        };

        const configMap = {};
        if (Array.isArray(categoriaBadgesConfig)) {
            categoriaBadgesConfig.forEach(b => { configMap[b.categoriaKey] = b; });
        }

        // Evaluar ofertas automáticamente en base a productos cargados
        const ofertasPorCat = {};
        if (Array.isArray(productosRaw)) {
            productosRaw.forEach(p => {
                const c = p.categoria || '';
                const dto = Number(p.descuento) || 0;
                if (dto > 0) {
                    if (!ofertasPorCat[c] || dto > ofertasPorCat[c]) {
                        ofertasPorCat[c] = dto;
                    }
                }
            });
        }

        for (const [key, span] of Object.entries(catMap)) {
            if (!span) continue;
            const cfg = configMap[key];

            let activo = cfg ? cfg.activo : (key === 'Shots');
            let texto = cfg ? (cfg.texto || '').trim() : (key === 'Shots' ? 'PRÓXIMAMENTE' : '');
            let color = cfg ? (cfg.color || 'neon-magenta') : (key === 'Shots' ? 'neon-magenta' : 'neon-oro');
            let autoOferta = cfg ? cfg.autoOferta : true;

            // Si está activo pero sin texto manual, verificar auto-oferta
            if (activo && !texto && autoOferta) {
                const maxDto = ofertasPorCat[key];
                if (maxDto && maxDto > 0) {
                    texto = `¡OFERTA -${Math.round(maxDto)}%!`;
                    color = color || 'neon-oro';
                }
            }

            if (activo && texto) {
                const colClase = color.startsWith('liston-') ? color : `liston-${color}`;
                span.className = `liston-categoria-neon ${colClase} ${color}`;
                let icono = '';
                const txtUpper = texto.toUpperCase();
                if (txtUpper.includes('PROX') || txtUpper.includes('PRONTO')) {
                    icono = '<i class="bi bi-clock-history me-1"></i>';

            if (f.includes('pack') || f.includes('pulpa')) {
                return esPack;
            }
            if (f.includes('shot')) {
                return esShot && !esPack;
            }
            // Categoría Elíxires (500 mls): no debe incluir ni packs, ni pulpas, ni shots
            return !esPack && !esShot;

    function obtenerSubcategoriaInsumo(i) {
        if (i.subcategoria && i.subcategoria.trim() !== '') return i.subcategoria;
        const nom = (i.nombre || '').toLowerCase();
        const cat = (i.categoria || '').toLowerCase();
        if (cat.includes('base') || nom.includes('leche') || nom.includes('agua') || nom.includes('aloe') || nom.includes('base') || nom.includes('yogur')) return 'Base';
        if (cat.includes('semilla') || nom.includes('chía') || nom.includes('chia') || nom.includes('linaza') || nom.includes('sésamo') || nom.includes('sesamo')) return 'Semillas';
        if (cat.includes('fruta') || nom.includes('piña') || nom.includes('pina') || nom.includes('manzana') || nom.includes('limón') || nom.includes('limon') || nom.includes('betarraga') || nom.includes('frut') || nom.includes('mango') || nom.includes('platano') || nom.includes('plátano')) return 'Frutas';
        if (cat.includes('vegetal') || cat.includes('verdura') || nom.includes('espinaca') || nom.includes('apio') || nom.includes('zanahoria') || nom.includes('acelga') || nom.includes('pepino')) return 'Vegetales';
        if (cat.includes('especia') || nom.includes('canela') || nom.includes('jengibre') || nom.includes('cúrcuma') || nom.includes('curcuma') || nom.includes('pimienta') || nom.includes('clavo')) return 'Especias';
        if (cat.includes('endulzante') || cat.includes('miel') || nom.includes('stevia') || nom.includes('estevia') || nom.includes('miel') || nom.includes('agave') || nom.includes('azúcar') || nom.includes('azucar')) return 'Endulzantes';
        if (cat.includes('estabilizante') || nom.includes('goma') || nom.includes('xantana') || nom.includes('pectina') || nom.includes('agar')) return 'Estabilizantes';
        if (cat.includes('grasa') || nom.includes('palta') || nom.includes('mantequilla') || nom.includes('cacao')) return 'Grasas';
        if (cat.includes('proteína') || cat.includes('proteina') || nom.includes('whey') || nom.includes('proteina') || nom.includes('proteína')) return 'Proteínas';
        if (cat.includes('cereal') || nom.includes('avena') || nom.includes('quinoa') || nom.includes('quinua') || nom.includes('arroz') || nom.includes('mandioca')) return 'Cereales';
        if (cat.includes('suplemento') || nom.includes('espirulina') || nom.includes('maca') || nom.includes('aceite') || nom.includes('colágeno')) return 'Suplementos';
        if (cat.includes('seco') || nom.includes('maní') || nom.includes('mani') || nom.includes('nuez') || nom.includes('nueces') || nom.includes('almendra')) return 'Frutos Secos';
        return 'Vegetales';
    }

        const prodMatch = (productosRaw || []).find(p => p.imagen && p.imagen.trim() !== '' && (normalizarStr(p.nombre).includes(nomLimpio) || nomLimpio.includes(normalizarStr(p.nombre))));

        for (const [clave, url] of Object.entries(CATALOGO_IMAGENES_INGREDIENTES)) {

                    <button class="btn btn-sm ${subcategoriaFiltroActual==='Proteínas'?'btn-warning text-dark fw-bold':'btn-outline-light'}" onclick="filtrarSubcategoriaArmaTuBatido('Proteínas')">💪 PROTEÍNAS</button>
                    <button class="btn btn-sm ${subcategoriaFiltroActual==='Cereales'?'btn-warning text-dark fw-bold':'btn-outline-light'}" onclick="filtrarSubcategoriaArmaTuBatido('Cereales')">🌾 CEREALES</button>
                </div>
            </div>
        `;

        let insumosFiltrados = insumosArmado;
        if (subcategoriaFiltroActual !== 'Todas') {
            insumosFiltrados = insumosArmado.filter(i => (i.subcategoria || obtenerSubcategoriaInsumo(i)).toLowerCase() === subcategoriaFiltroActual.toLowerCase());
        }

        if (insumosFiltrados.length === 0) {
            htmlBuilder += `<div class="col-12 text-center text-white-50 py-5 fs-6 font-orbitron">No hay ingredientes disponibles en la subcategoría <b>${subcategoriaFiltroActual.toUpperCase()}</b>.</div>`;
        }

        insumosFiltrados.forEach(ins => {
            let idInsClean = String(ins.idInsumo || ins.id || 'ins').replace(/'/g, "\\'");
            let cantPorc = porcionesArmado[idInsClean] || porcionesArmado[ins.idInsumo] || 0;
            let precioBasePorc = ins.precio || 0;
            let dtoPorc = (ins.descuento && ins.descuento > 0) ? Math.min(Math.round(ins.descuento), 100) : 0;
            let precioFinalPorc = dtoPorc > 0 ? Math.round(precioBasePorc * (1 - dtoPorc / 100)) : precioBasePorc;
            let sizePorcion = (ins.sizePorcion && Number(ins.sizePorcion) > 0) ? Number(ins.sizePorcion) : 1;
            let stockRaw = (ins.unidadActual !== undefined && ins.unidadActual !== null) ? Number(ins.unidadActual) : 0;
            let porcionesDisponibles = (sizePorcion > 1 && stockRaw >= sizePorcion && (ins.medida === 'gr' || ins.medida === 'mls'))
                ? Math.floor(stockRaw / sizePorcion)
                : Math.max(0, Math.floor(stockRaw));

            const esAgotado = porcionesDisponibles <= 0;
            const esUltimas = porcionesDisponibles > 0 && porcionesDisponibles <= 10;
            const esDisponible = porcionesDisponibles > 10;

            let porcTexto = `${sizePorcion} ${ins.medida || 'gr'}`;
            let subcatLabel = (ins.subcategoria || obtenerSubcategoriaInsumo(ins)).toUpperCase();
            let nombreEscape = (ins.nombre || '').replace(/'/g, "\\'");
            let imgUrl = obtenerImagenIngrediente(ins);

            let ribbonDto = '';
            if (dtoPorc > 0) {
                ribbonDto = `
                    <span class="badge bg-danger font-orbitron position-absolute top-0 end-0 m-1 fw-bold shadow-lg"

            let badgeStock = '';
            let bordeCard = 'border: 1px solid rgba(0, 229, 255, 0.25);';
            let bordeImg = 'border-info border-opacity-50';
            let overlayImg = '';

            if (esAgotado) {
                badgeStock = `<div class="badge-stock-estado badge-agotado mb-2"><i class="bi bi-x-circle-fill me-1"></i> AGOTADO (0 DISP)</div>`;
                bordeCard = 'border: 1px solid rgba(220, 53, 69, 0.5);';
                bordeImg = 'border-danger';
                overlayImg = `
                    <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background: rgba(0,0,0,0.7); z-index: 4;">
                        <span class="badge bg-danger font-orbitron px-2 py-1 fs-7 fw-bold" style="box-shadow: 0 0 10px red;">
                            <i class="bi bi-slash-circle me-1"></i> AGOTADO
                        </span>
                    </div>
                `;
            } else if (esUltimas) {
                badgeStock = `<div class="badge-stock-estado badge-ultimas mb-2"><i class="bi bi-exclamation-triangle-fill me-1"></i> ¡ÚLTIMAS ${porcionesDisponibles} UNIDADES!</div>`;
                bordeCard = 'border: 2px solid #ffc107; box-shadow: 0 0 15px rgba(255, 193, 7, 0.3);';
                bordeImg = 'border-warning';
                overlayImg = `
                    <span class="badge bg-warning text-dark font-orbitron position-absolute bottom-0 end-0 m-1 fw-bold" style="font-size: 0.65rem; box-shadow: 0 0 8px rgba(255,193,7,0.8); z-index: 5;">
                        ¡QUEDAN ${porcionesDisponibles}!

            const disPlus = (esAgotado || cantPorc >= porcionesDisponibles) ? 'disabled' : '';
            const classPlus = (!esAgotado && cantPorc < porcionesDisponibles) ? 'btn-warning text-dark' : 'btn-secondary text-white-50';
            const titlePlus = esAgotado ? 'Agotado en Bodega' : (cantPorc >= porcionesDisponibles ? 'Máximo stock alcanzado' : 'Añadir porción');
            let btnPlus = `<button id="btn-plus-${idInsClean}" class="btn ${classPlus} fw-bold px-3 py-1 shadow-sm" style="border-radius: 8px;" ${disPlus} onclick="modificarPorcionInsumo('${idInsClean}', 1, ${precioFinalPorc}, '${nombreEscape}', ${porcionesDisponibles}, ${sizePorcion})" title="${titlePlus}">+</button>`;

            const esVideoIng = imgUrl && /\.(mp4|webm|mov|m4v|ogv)(\?.*)?$/i.test(imgUrl.trim());
            const mediaIngTag = esVideoIng
                ? `<video src="${imgUrl}" autoplay loop muted playsinline class="w-100 h-100" style="object-fit: cover; ${esAgotado ? 'filter: grayscale(80%) opacity(0.5);' : ''}"></video>`

            let precioHtml = (dtoPorc > 0)
                ? `<div class="mb-2 font-orbitron">
                     <span class="text-white-50 text-decoration-line-through small me-1" style="font-size: 0.82rem;">${simboloActual}${precioBasePorc.toLocaleString('es-CL')}</span>

        grid.innerHTML = htmlBuilder;

    function modificarPorcionInsumo(idInsumo, delta, precio, nombre, maxPorciones, sizePorcion = 1) {
        if (!porcionesArmado[idInsumo]) porcionesArmado[idInsumo] = 0;
        let actual = porcionesArmado[idInsumo];
        if (delta > 0) {
            if (maxPorciones <= 0) {
                alert(`El ingrediente "${nombre}" se encuentra AGOTADO en inventario.`);
                return;
            }
            if (actual >= maxPorciones) {
                alert(`¡Reserva de inventario alcanzada! Solo quedan ${maxPorciones} unidades disponibles de "${nombre}".`);
                return;
            }
        }
        porcionesArmado[idInsumo] = Math.max(0, actual + delta);
        
        insumosInfoMap[idInsumo] = { nombre: nombre, precio: precio, cantidad: porcionesArmado[idInsumo], sizePorcion: sizePorcion };
        
        const spanCant = document.getElementById(`cant-porc-${idInsumo}`);
        if (spanCant) spanCant.innerText = porcionesArmado[idInsumo];
        
        const btnPlus = document.getElementById(`btn-plus-${idInsumo}`);
        if (btnPlus) {
            btnPlus.disabled = (porcionesArmado[idInsumo] >= maxPorciones);
            if (btnPlus.disabled) {
                btnPlus.className = 'btn btn-secondary text-white-50 fw-bold px-3 py-1 shadow-sm';
            } else {
                btnPlus.className = 'btn btn-warning text-dark fw-bold px-3 py-1 shadow-sm';
            }
        }
        const btnMinus = document.getElementById(`btn-minus-${idInsumo}`);
        if (btnMinus) {
            btnMinus.disabled = (porcionesArmado[idInsumo] <= 0);
            if (btnMinus.disabled) {
                btnMinus.className = 'btn btn-outline-secondary text-white-50 fw-bold px-3 py-1';
            } else {
                btnMinus.className = 'btn btn-outline-warning text-warning fw-bold px-3 py-1';
            }
        }
        
        actualizarResumenCustom();
    }

    function actualizarResumenCustom() {
        let resumenDiv = document.getElementById('resumen-ingredientes-custom');
        let precioTotalSpan = document.getElementById('precio-total-custom');
        if (!resumenDiv || !precioTotalSpan) return;

        let lista = [];
        let total = 0;

        for (let id in porcionesArmado) {
            let cant = porcionesArmado[id];
            if (cant > 0 && insumosInfoMap[id]) {
                let info = insumosInfoMap[id];
                lista.push(`${cant}x ${info.nombre}`);
                total += (cant * info.precio);
            }
        }

        if (lista.length === 0) {
            resumenDiv.innerText = "Ningún ingrediente seleccionado aún";
            precioTotalSpan.innerText = simboloActual + "0";
        } else {
            resumenDiv.innerText = lista.join(", ");
            precioTotalSpan.innerText = simboloActual + total.toLocaleString('es-CL');
        }
    }

    function agregarBatidoCustomAlCarrito() {
        let lista = [];
        let lineasReceta = [];
        let total = 0;

        for (let id in porcionesArmado) {
            let cant = porcionesArmado[id];
            if (cant > 0 && insumosInfoMap[id]) {
                let info = insumosInfoMap[id];
                const porcionDosis = (info.sizePorcion && Number(info.sizePorcion) > 0) ? Number(info.sizePorcion) : 1;
                const gastoReal = cant * porcionDosis; // Descuento de bodega según la cantidad de porción (gr/mls)
                lista.push(`${cant}x ${info.nombre}`);
                lineasReceta.push(`${info.nombre}:${gastoReal}`);
                total += (cant * info.precio);
            }
        }

        if (lista.length === 0 || total === 0) {
            alert("Por favor selecciona al menos una porción de ingrediente para armar tu batido.");
            return;
        }

        let itemCustom = {
            id: 'custom_' + Date.now(),
            nombre: 'Batido Armado 500cc: ' + lista.join(', '),
            categoria: 'Arma tu Batido',
            precio: total,
            recetaDetalle: lineasReceta.join('\n'),
            esCustom: true
        };

        carrito.push(itemCustom);
        actualizarCarrito();
        playCashSound();

        // Resetear selección
        porcionesArmado = {};
        insumosInfoMap = {};
        renderizar();
    }

    function flip(id) { document.getElementById(`card-${id}`).classList.toggle('flipped'); }
    function filtrar(cat, btn) { filtroActual = cat; document.querySelectorAll('.categoria-badge').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderizar(); }

    function agregar(id, nombre, precio, btn, dto = 0, precioOriginal = null) {
        if(btn) {
            const originalHTML = btn.innerHTML; btn.innerHTML = '<i class="bi bi-check2"></i>'; btn.style.background = 'var(--bio-oro)'; btn.style.color = '#000';
            setTimeout(()=>{ btn.innerHTML = originalHTML; btn.style=''; }, 600);
        }
        const precioCobrar = Number(precio);
        const descuentoPct = Number(dto) || 0;
        let base = Number(precioOriginal);
        if (!base || isNaN(base) || base <= 0) {
            base = descuentoPct > 0 ? Math.round(precioCobrar / (1 - descuentoPct / 100)) : precioCobrar;
        }

        carrito.push({
            id: id,
            nombre: nombre,
            precio: precioCobrar,
            precioOriginal: base,
            descuento: descuentoPct
        });
        actualizarCarrito();
    }

        if(carrito.length > 0) {
            bar.style.display = 'flex';
            document.getElementById('items-count').innerText = carrito.length;
            const total = carrito.reduce((s, i) => s + i.precio, 0);
            const totalAhorro = carrito.reduce((s, i) => s + ((i.precioOriginal || i.precio) - i.precio), 0);

            if (totalAhorro > 0) {
                document.getElementById('total-precio').innerHTML = `
                    <span>${simboloActual}${total.toLocaleString('es-CL')}</span>
                    <span class="badge bg-danger ms-2 font-orbitron" style="font-size:0.75rem;">AHORRAS ${simboloActual}${totalAhorro.toLocaleString('es-CL')}</span>
                `;
            } else {
                document.getElementById('total-precio').innerText = simboloActual + total.toLocaleString('es-CL');

        } else {
            bar.style.display = 'none';
        }
    }

    function eliminar(idx, e) { e.stopPropagation(); carrito.splice(idx, 1); actualizarCarrito(); if(carrito.length > 0) { abrirModalCarrito(); } else { modalCarritoCliente.hide(); } }

    async function confirmarPedido(metodoPago) {
        const nombre = document.getElementById('nombreCliente').value.trim(); const direccion = document.getElementById('direccionCliente').value.trim(); const telefono = document.getElementById('telefonoCliente').value.trim();
        if(!nombre || !direccion || !telefono) { alert("Por favor, ingresa tu Identificación, Coordenadas y Enlace (Nombre, Dirección y Teléfono) para procesar la extracción."); return; }

        // Buscamos el botón dentro del contenedor para ponerle el loading
        const btn = document.querySelector('#contenedor-botones-pago button');
        const contenidoOriginal = btn.innerHTML;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> CONECTANDO NÚCLEO...`; btn.disabled = true;

        // El nombre de la sucursal ya no viene del select text, porque el select ya no existe.
        // Lo sacamos directamente del input oculto.
        const paisNombre = document.getElementById('sucursal-activa').value;
        const payload = { cliente: { nombre, direccion, telefono }, items: carrito, origen: 'Reserva Bio-Tech', pais: paisNombre };

        try {
            // ---> AUTO-REGISTRO CRM DE CLIENTES BÁSICOS <---
            try { await fetch('/api/clientes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre: nombre, direccion: direccion, telefono: telefono, nodo: paisNombre }) }); } catch(errCrm) {}

            if (metodoPago === 'MercadoPago') {
                const resMp = await fetch('/api/pagos/mercadopago', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (resMp.ok) {
                    const linkMercadoPago = await resMp.text();
                    await fetch(`/api/ventas?metodo=MercadoPago`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    // NOTA: El descuento de inventario ya se hace de forma segura en el Backend cuando el pago es confirmado
                    // carrito.forEach(item => fetch(`/api/inventario/vender?idProducto=${item.id}&cantidad=1`, { method: 'POST' }));
                    
                    carrito = []; actualizarCarrito(); modalCarritoCliente.hide(); window.location.href = linkMercadoPago;
                } else { throw new Error("Fallo en servidor MP"); }
            }
        } catch (error) {
            setTimeout(async () => {
                alert(`Simulando redirección a pago para: ${nombre}...\n(Servidor WebPay / Local No config)`);
                // En modo prueba local simulamos venta standard
                await fetch(`/api/ventas?metodo=MercadoPago`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                carrito = []; actualizarCarrito(); modalCarritoCliente.hide(); btn.innerHTML = contenidoOriginal; btn.disabled = false;
            }, 1000);
        }
    }

    // ==========================================
    // SISTEMA DE VOZ INTELIGENTE (CARRITO / GLOBAL)
    // ==========================================
    let recVozCliente = null;

    function hablarCliente(texto) {
        window.speechSynthesis.cancel();
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = 'es-ES'; voz.rate = 1.0; voz.pitch = 1.1;
        window.speechSynthesis.speak(voz);
    }

    function iniciarVozCliente() {
        if (!('webkitSpeechRecognition' in window)) {
            alert("Tu navegador no soporta el reconocimiento de voz."); return;
        }

        const btnMic = document.getElementById('btn-mic-cliente');

        if(recVozCliente) recVozCliente.stop();

        recVozCliente = new webkitSpeechRecognition();
        recVozCliente.lang = 'es-ES';
        recVozCliente.continuous = false;
        recVozCliente.interimResults = false;

        recVozCliente.onstart = function() {
            btnMic.classList.add('escuchando');
        };

        recVozCliente.onresult = function(event) {
            const comandoRaw = event.results[0][0].transcript;
            procesarComandoCliente(comandoRaw);
        };

        recVozCliente.onend = function() {
            btnMic.classList.remove('escuchando');
        };

        recVozCliente.start();
    }

    function procesarComandoCliente(comandoRaw) {
        const normalizar = (str) => {
            if(!str) return "";
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        };

        const comando = normalizar(comandoRaw);

        if (comando.includes("pagar") || comando.includes("cobrar") || comando.includes("ver carrito") || comando.includes("terminar")) {
            if(carrito.length > 0) {
                abrirModalCarrito();
                hablarCliente("Revisemos tu selección para proceder a la extracción.");
            } else {
                hablarCliente("Tu reserva vital está vacía. Añade elíxires primero.");
            }
            return;
        }

        if (comando.includes("limpiar") || comando.includes("borrar") || comando.includes("vaciar")) {
            if (carrito.length > 0) {
                carrito = []; actualizarCarrito(); hablarCliente("Tu reserva ha sido purgada.");
            }
            return;
        }

        let candidatos = productosRaw.filter(p => {
            if(!p.nombre) return false;
            return comando.includes(normalizar(p.nombre));
        });

        candidatos.sort((a, b) => b.nombre.length - a.nombre.length);
        let productoEncontrado = candidatos[0];

        if (productoEncontrado) {
            let btnElement = document.querySelector(`#card-${productoEncontrado.id} .btn-extraer`);
            const dto = (productoEncontrado.descuento && productoEncontrado.descuento > 0) ? Math.min(Math.round(productoEncontrado.descuento), 100) : 0;
            const precioFinal = dto > 0 ? Math.round(productoEncontrado.precio * (1 - dto / 100)) : productoEncontrado.precio;
            agregar(productoEncontrado.id, productoEncontrado.nombre, precioFinal, btnElement, dto, productoEncontrado.precio);
            hablarCliente("Excelente elección. He añadido " + productoEncontrado.nombre + " a tu reserva.");
        } else {
            hablarCliente("Lo siento, no pude identificar ese elíxir. Intenta pronunciar su nombre nuevamente.");
        }
    }

    // ==========================================
    // SISTEMA DE VOZ WIZARD (DENTRO DEL MODAL DATOS)
    // ==========================================
    let estadoModalVoz = 'LIBRE';
    let recVozModal = null;

    function hablarModal(texto, siguienteEstado) {
        window.speechSynthesis.cancel();
        estadoModalVoz = siguienteEstado || 'LIBRE';
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = 'es-ES'; voz.rate = 1.0; voz.pitch = 1.1;

        if (siguienteEstado) {
            voz.onend = function() {
                setTimeout(iniciarReconocimientoModal, 300);
            };
        }
        window.speechSynthesis.speak(voz);
    }

    function iniciarVozModal() {
        hablarModal("Iniciando captura de datos. Por favor, dime tu nombre.", 'ESPERANDO_NOMBRE');
    }

    function iniciarReconocimientoModal() {
        if (!('webkitSpeechRecognition' in window)) return;
        if (recVozModal) recVozModal.stop();

        recVozModal = new webkitSpeechRecognition();
        recVozModal.lang = 'es-ES';
        recVozModal.continuous = false;
        recVozModal.interimResults = false;

        const btnMicModal = document.getElementById('btn-mic-modal');

        recVozModal.onstart = function() {
            btnMicModal.style.backgroundColor = 'rgba(255, 0, 0, 0.2)';
            btnMicModal.style.borderColor = '#ff4444';
            btnMicModal.style.color = '#ff4444';
            btnMicModal.innerHTML = '<i class="bi bi-mic-fill me-2" style="animation: latidoMic 1s infinite;"></i> ESCUCHANDO...';
        };

        recVozModal.onresult = function(event) {
            const comandoRaw = event.results[0][0].transcript;
            procesarComandoModal(comandoRaw);
        };

        recVozModal.onend = function() {
            btnMicModal.style.backgroundColor = 'transparent';
            btnMicModal.style.borderColor = 'var(--bio-aqua)';
            btnMicModal.style.color = 'var(--bio-aqua)';
            btnMicModal.innerHTML = '<i class="bi bi-mic-fill me-2"></i> DICTAR DATOS POR VOZ';
        };

        recVozModal.start();
    }

    function procesarComandoModal(comandoRaw) {
        if (estadoModalVoz === 'ESPERANDO_NOMBRE') {
            document.getElementById('nombreCliente').value = comandoRaw.toUpperCase();
            hablarModal("Nombre registrado. ¿Cuál es tu dirección de entrega?", 'ESPERANDO_DIRECCION');
        }
        else if (estadoModalVoz === 'ESPERANDO_DIRECCION') {
            document.getElementById('direccionCliente').value = comandoRaw.toUpperCase();
            hablarModal("Coordenadas guardadas. Finalmente, díctame tu número de teléfono.", 'ESPERANDO_TELEFONO');
        }
        else if (estadoModalVoz === 'ESPERANDO_TELEFONO') {
            document.getElementById('telefonoCliente').value = comandoRaw.replace(/\s/g, '');
            // Terminamos el flujo y le advertimos que el pago es manual por seguridad
            hablarModal("Datos completados. Por protocolos de seguridad, el método de pago debe seleccionarse de forma manual. Por favor, autoriza la transacción en pantalla.");
            estadoModalVoz = 'LIBRE';
        }
    }

</script>
