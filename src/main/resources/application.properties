spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:Linda236}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${PORT:8081}

# OPTIMIZADOR EXTREMO PARA EL FETCH Y EL CLOUD (GZIP)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# CONFIGURACIÓN DE MULTIMEDIA Y CARGA MASIVA (HASTA 100MB PARA VIDEOS E IMÁGENES)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# DIRECTORIO DE ALMACENAMIENTO DE MULTIMEDIA PÚBLICA
media.upload.dir=${MEDIA_UPLOAD_DIR:uploads/media}

